<g fill="#514a3a" font-size="12" text-anchor="middle"><text x="1170" y="329">01  ACCESS CONTROL</text><text x="1170" y="363">02  CONTENT CHECKS</text><text x="1170" y="397">03  USAGE ACCOUNTING</text></g>
