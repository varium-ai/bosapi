<text x="1421" y="86" text-anchor="middle" fill="#e0c99a" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">COMMUNITY EDITION</text>
<g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="78" letter-spacing="-2.8">
<text x="84" y="244" fill="#f7f7f9">Your models.</text>
