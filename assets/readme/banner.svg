<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">BOS API — Your models. One gateway.</title>
<desc id="hero-desc">BOS API community gateway. Manage access, inspect requests and understand usage on your own infrastructure. An illustrative flow connects applications through BOS API to model services.</desc>
<defs>
<linearGradient id="hero-bg" x2="1" y2="1"><stop stop-color="#161a25"/><stop offset=".62" stop-color="#0c0e14"/><stop offset="1" stop-color="#181c26"/></linearGradient>
<linearGradient id="hero-gold" x2="1" y2="1"><stop stop-color="#fcf7ed"/><stop offset=".52" stop-color="#e0c99a"/><stop offset="1" stop-color="#af9566"/></linearGradient>
<linearGradient id="hero-line"><stop stop-color="#e0c99a" stop-opacity="0"/><stop offset=".5" stop-color="#e0c99a" stop-opacity=".46"/><stop offset="1" stop-color="#e0c99a" stop-opacity="0"/></linearGradient>
<radialGradient id="hero-halo"><stop stop-color="#e0c99a" stop-opacity=".14"/><stop offset="1" stop-color="#e0c99a" stop-opacity="0"/></radialGradient>
<linearGradient id="hero-card" x2="1" y2="1"><stop stop-color="#1a1f2c"/><stop offset="1" stop-color="#11141c"/></linearGradient>
<symbol id="bos-mark" viewBox="0 0 512 512">


  <defs>
    <linearGradient id="bos-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35383f"/>
      <stop offset="0.55" stop-color="#2b2d34"/>
      <stop offset="1" stop-color="#202229"/>
    </linearGradient>

    <!-- Subtle Hairline Rim -->
    <linearGradient id="bos-rim" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgba(221,194,140,0.65)"/>
      <stop offset="1" stop-color="rgba(165,139,93,0.35)"/>
    </linearGradient>

    <!-- Champagne Gold Sheen for the Geometric Origami Glyphs -->
    <linearGradient id="bos-glyph" x1="142" y1="120" x2="370" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2e9da"/>
      <stop offset="0.75" stop-color="#ddc28c"/>
      <stop offset="1" stop-color="#a58b5d"/>
    </linearGradient>

    <!-- Negative Space Cutout Mask for Optical Apertures -->
    <mask id="bos-aperture-mask">
      <rect width="512" height="512" fill="#ffffff"/>
      <circle cx="264" cy="197" r="28" fill="#000000"/>
      <circle cx="276" cy="313" r="28" fill="#000000"/>
    </mask>
  </defs>

  <!-- Squircle Canvas Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bos-bg)"/>
  <rect x="25" y="25" width="462" height="462" rx="111" stroke="url(#bos-rim)" stroke-width="2" fill="none"/>

  <!-- Scheme S3: Origami Fold Gateway Monogram -->
  <g mask="url(#bos-aperture-mask)">
    <!-- Upper Chamfered Origami Block -->
    <path d="M 142 127 H 284 L 354 197 L 284 267 H 142 Z" fill="url(#bos-glyph)"/>

    <!-- Lower Chamfered Origami Block -->
    <path d="M 142 241 H 298 L 370 313 L 298 385 H 142 Z" fill="url(#bos-glyph)"/>
  </g>
</symbol>
</defs>
<rect width="1600" height="600" rx="24" fill="url(#hero-bg)"/>
<rect x=".5" y=".5" width="1599" height="599" rx="23.5" fill="none" stroke="#e0c99a" stroke-opacity=".17"/>
<ellipse cx="1160" cy="300" rx="440" ry="320" fill="url(#hero-halo)"/>
<g stroke="#fff" stroke-opacity=".026"><path d="M 780 80 H 1536 M 780 180 H 1536 M 780 280 H 1536 M 780 380 H 1536 M 780 480 H 1536 M 820 48 V 552 M 940 48 V 552 M 1060 48 V 552 M 1180 48 V 552 M 1300 48 V 552 M 1420 48 V 552"/></g>
