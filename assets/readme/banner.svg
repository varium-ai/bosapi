<g fill="#e4e5e9" font-size="16" font-weight="600" text-anchor="middle"><text x="888.5" y="221">Applications</text><text x="888.5" y="313">SDKs &amp; clients</text><text x="888.5" y="405">Team workflows</text><text x="1461" y="257">Model APIs</text><text x="1461" y="349">Your endpoints</text></g>
