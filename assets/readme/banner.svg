<g fill="#ead8af"><circle cx="1059" cy="307" r="4"/><circle cx="1281" cy="307" r="4"/></g>
<text x="1171" y="513" text-anchor="middle" fill="#777d8b" font-size="11" letter-spacing="1.3">ON YOUR INFRASTRUCTURE</text>
<text x="1171" y="535" text-anchor="middle" fill="#505766" font-size="9" letter-spacing="1.5">ILLUSTRATIVE FLOW</text>
