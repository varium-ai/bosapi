# Include inside the existing server, replacing its catch-all proxy location.
# Keep the existing TLS, server_name, upload limit and other site settings.
# The http context must include mime.types and bosapi-connection.conf.
root /var/www/bosapi/current;
gzip on;
gzip_static on;
gzip_vary on;
gzip_min_length 256;
gzip_comp_level 5;
gzip_types application/javascript text/javascript text/css application/json
           image/svg+xml text/plain application/xml;

# Keep this regex before static extensions: /images and aliases belong to Go.
location ~ ^/(api/v1|v1|v1beta|health|models|responses|messages|images|embeddings|chat/completions)(/|$) {
    include /etc/nginx/snippets/bosapi-proxy.conf;
}

location ~ /\. {
    return 404;
}

# Shared immutable files outlive current so old tabs can still lazy-load chunks.
location ~ "^/assets/.+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+$" {
    root /var/www/bosapi;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}

location /assets/ {
    try_files $uri =404;
    add_header Cache-Control no-cache;
    add_header X-Content-Type-Options nosniff always;
}

location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma no-cache;
    add_header Expires 0;
    add_header X-Content-Type-Options nosniff always;
}

# Public files must never fall back to HTML when they are missing.
location ~ /[^/]+\.[^/]+$ {
    try_files $uri =404;
    add_header Cache-Control no-cache;
    add_header X-Content-Type-Options nosniff always;
}

location / {
    # File checks only: /docs is also a real directory in the Vite output.
    try_files $uri /index.html;
    add_header Cache-Control no-cache;
    add_header X-Content-Type-Options nosniff always;
}
