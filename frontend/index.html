<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOS API</title>
    <style>
      @media (max-width: 991.98px) {
        .startup-sidebar {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        data-startup-shell
        style="
          display: flex;
          min-height: 100vh;
          background: #f7f7f7;
          font-family:
            -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        "
      >
        <aside
          class="startup-sidebar"
          style="
            width: 240px;
            height: 100vh;
            background: #fff;
            border-right: 1px solid #e5e5e5;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
          "
        >
          <div
            style="
              height: 56px;
              display: flex;
              align-items: center;
              padding: 0 20px;
              gap: 12px;
              border-bottom: 1px solid #e5e5e5;
              box-sizing: border-box;
            "
          >
            <img src="/logo.svg" alt="" width="32" height="32" style="flex-shrink: 0" />
            <div style="font-weight: 600; font-size: 15px; color: #171717; letter-spacing: -0.2px">
              BOS API
            </div>
          </div>
          <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
            <div style="height: 28px; background: #f0f0f0; border-radius: 6px; width: 70%"></div>
            <div style="height: 28px; background: #f5f5f5; border-radius: 6px; width: 85%"></div>
            <div style="height: 28px; background: #f5f5f5; border-radius: 6px; width: 60%"></div>
            <div style="height: 28px; background: #f5f5f5; border-radius: 6px; width: 80%"></div>
          </div>
        </aside>
        <div style="flex: 1; display: flex; flex-direction: column">
          <header
            style="
              height: 56px;
              background: #fff;
              border-bottom: 1px solid #e5e5e5;
              display: flex;
              align-items: center;
              justify-content: space-between;
              padding: 0 24px;
              box-sizing: border-box;
            "
          >
            <div style="width: 120px; height: 20px; background: #f0f0f0; border-radius: 4px"></div>
            <div style="width: 32px; height: 32px; background: #f0f0f0; border-radius: 50%"></div>
          </header>
          <main style="padding: 24px; display: flex; flex-direction: column; gap: 16px">
            <div style="height: 24px; background: #f0f0f0; border-radius: 4px; width: 160px"></div>
            <div
              style="
                height: 320px;
                background: #fff;
                border: 1px solid #e5e5e5;
                border-radius: 10px;
              "
            ></div>
          </main>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
